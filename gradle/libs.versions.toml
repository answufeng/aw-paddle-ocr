[versions]
# Android Gradle Plugin & Kotlin
agp = "8.2.2"
kotlin = "2.0.21"

# 协程
coroutines = "1.9.0"

# AndroidX
core-ktx = "1.15.0"
appcompat = "1.7.0"
lifecycle = "2.8.7"
annotation = "1.9.1"
material = "1.12.0"
constraintlayout = "2.2.0"
recyclerview = "1.3.2"
activity-ktx = "1.9.3"

# CameraX
camerax = "1.3.4"

# PaddleOCR
paddleocr = "1.3.0"

# ========================================
# [libraries]
# ========================================

[libraries]
# ---------- Coroutines ----------
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ---------- AndroidX ----------
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity-ktx" }

# ---------- CameraX ----------
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# ---------- PaddleOCR ----------
paddleocr = { group = "com.github.RapidAI.RapidOcrAndroidOnnx", name = "OcrLibrary", version.ref = "paddleocr" }

# ========================================
# [plugins]
# ========================================

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "12.1.0" }
